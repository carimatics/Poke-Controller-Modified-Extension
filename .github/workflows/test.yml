name: Test
on:
  pull_request:
    branches:
      - master
      - develop
      - rewritten # tmp
  push:
    branches:
      - master
      - develop
      - rewritten # tmp

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Mise
        uses: jdx/mise-action@v2
        with:
          version: 2025.12.0
          install: true
          cache: true
      - name: Debug mise task detection
        run: |
          echo "=== Mise version ==="
          mise --version

          echo "=== File permissions (Git bash) ==="
          ls -la mise-tasks/

          echo "=== Mise debug ==="
          mise tasks --log-level=debug
        shell: bash
      - run: net user
        if: runner.os == 'Windows'
      - name: Set mise-tasks executable permissions
        if: runner.os == 'Windows'
        run: |
          Get-ChildItem -Path "mise-tasks\*" -Recurse | ForEach-Object {
              icacls $_.FullName /grant ${env:USERNAME}:RX
          }
      - run: mise --version
      - run: mise tasks
      - run: ls -R mise-tasks
      - name: Setup Runtime via uv
        run: uv sync
      - name: CI(Lint/Format/Typecheck/Test)
        run: mise run ci
