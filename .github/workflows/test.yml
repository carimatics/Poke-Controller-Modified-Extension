name: Test
on:
  pull_request:
    branches:
      - master
      - develop
      - rewritten # tmp
  push:
    branches:
      - master
      - develop
      - rewritten # tmp

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Mise
        uses: jdx/mise-action@v2
        with:
          version: 2025.12.12
          install: true
          cache: true
      - name: Setup Runtime via uv
        run: uv sync
      - name: CI
        run: mise run ci
